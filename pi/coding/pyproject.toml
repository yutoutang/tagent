[project]
name = "pi-coding"
version = "0.1.0"
description = "AI-powered coding CLI tool"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Mario Zechner"},
]
keywords = ["coding-agent", "ai", "llm", "cli", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pi-agent>=0.1.0",
    "pi-ai>=0.1.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "aiofiles>=24.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "textual>=0.80.0",
    "markdown>=3.6.0",
    "prompt-toolkit>=3.0.0",
    "pyperclip>=1.8.0",
    "pillow>=10.0.0",
    "python-magic>=0.4.27",
    "pygments>=2.17.0",
    "gitpython>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "black>=24.0.0",
    "isort>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.6.0",
]

[project.scripts]
pi = "pi.coding.cli_main:main"

[project.urls]
Homepage = "https://github.com/badlogic/pi-mono"
Repository = "https://github.com/badlogic/pi-mono"

[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["pi/coding/tests"]
pythonpath = ["."]
